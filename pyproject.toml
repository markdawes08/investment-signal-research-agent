[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-signal-research-agent"
version = "1.0.0"
description = "An audited, deterministic offline multi-agent investment research MVP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
signal-research-agent = "signal_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_research_agent = ["data/literature.json"]
